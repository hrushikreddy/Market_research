[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "market-delay-research"
version = "1.0.0"
description = "Reproducible sentiment-based information-delay analysis for the S&P 500 and FTSE 100"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Hrushik Reddy Tadvai"}]
dependencies = [
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "scipy>=1.13,<2",
  "scikit-learn>=1.5,<2",
  "PyYAML>=6,<7",
  "pydantic>=2.8,<3",
  "matplotlib>=3.9,<4",
  "seaborn>=0.13,<1",
  "statsmodels>=0.14,<1",
]

[project.optional-dependencies]
nlp = ["torch>=2.3,<3", "transformers>=4.44,<5"]
data = ["yfinance>=0.2.40,<1", "pandas-market-calendars>=4.4,<6"]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7", "ruff>=0.6,<1", "mypy>=1.11,<2", "build>=1.2,<2", "pandas-stubs>=2.2"]

[project.scripts]
market-delay = "market_delay.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/market_delay"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
