
name: Market Research Dissertation Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Make
        run: sudo apt-get install -y make

      - name: Install dependencies
        run: make install

      - name: Build project
        run: make build

      - name: Run tests
        run: make test

      - name: Prepare empirical data
        run: |
          if [ -s data/processed/market_empirical.csv ] && \
             [ -s data/processed/news_proxy.csv ]; then
            echo "Using preserved empirical datasets"
          else
            make data
          fi

      - name: Verify empirical datasets
        run: |
          ls -lh data/processed/
          test -s data/processed/market_empirical.csv
          test -s data/processed/news_proxy.csv

      - name: Run empirical analysis
        run: make empirical

      - name: Generate dissertation figures
        run: make figures

      - name: Upload dissertation results
        uses: actions/upload-artifact@v4
        with:
          name: dissertation-results
          path: |
            reports/empirical/
            data/processed/
            htmlcov/
